<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TANE:i FreeCAD Studio（プロトタイプ）</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #FAF8F4;
    color: #1F3028;
    margin: 0;
    padding: 40px 20px;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-weight: 500; font-size: 24px; margin-bottom: 4px; }
  p.lead { color: #8A8A8A; margin-top: 0; font-size: 14px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 32px; margin-top: 32px; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  form { display: flex; flex-direction: column; gap: 14px; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
  label { font-size: 13px; font-weight: 500; display: flex; flex-direction: column; gap: 6px; }
  input, select {
    font-size: 14px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
    font-family: inherit;
  }
  button {
    margin-top: 8px; padding: 10px 16px; border: none; border-radius: 999px;
    background: #1F3028; color: #FAF8F4; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .result { min-height: 200px; }
  .result img { max-width: 100%; border-radius: 8px; border: 1px solid #eee; background: #fff; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; background: #fff; }
  th, td { border: 1px solid #eee; padding: 6px 10px; text-align: left; }
  th { background: #f5f3ef; }
  .status { font-size: 13px; color: #8A8A8A; margin-top: 10px; white-space: pre-wrap; }
  .status.error { color: #b3432b; }
  .mock-badge {
    background: #fff3cd; color: #7a5c00; border: 1px solid #f0d989;
    border-radius: 6px; padding: 8px 12px; font-size: 12px; margin-bottom: 10px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab-btn {
    padding: 6px 14px; border: 1px solid #ddd; border-radius: 999px; background: #fff;
    color: #1F3028; font-size: 13px; cursor: pointer;
  }
  .tab-btn.active { background: #1F3028; color: #FAF8F4; border-color: #1F3028; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  #viewer-3d-canvas {
    width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; border: 1px solid #eee;
    background: #f3f1ec; cursor: grab; display: block;
  }
  #viewer-3d-canvas:active { cursor: grabbing; }
  .viewer-hint { font-size: 12px; color: #8A8A8A; margin-top: 6px; }
  .finish-group {
    display: flex; flex-direction: column; gap: 10px; padding: 12px;
    background: #faf8f5; border: 1px solid #eee; border-radius: 8px;
  }
  .finish-group-title { font-size: 12px; font-weight: 600; color: #8A8A8A; margin: 0; }
  .finish-group label { font-weight: 400; }
</style>
</head>
<body>
<main>
  <h1>🌱 TANE:i FreeCAD Studio（プロトタイプ）</h1>
  <p class="lead">FreeCAD + POV-Rayによる、寸法・構造が正確な完成イメージと木取りリストの生成。既存のTANE:i／Gemini画像生成とは独立した検証用アプリです。</p>

  <div class="layout">
    <form id="render-form">
      <label>
        品名
        <input type="text" name="item" value="テレビ台" required />
      </label>
      <label>
        幅 W (mm)
        <input type="number" name="width" value="1200" min="100" max="3000" required />
      </label>
      <label>
        奥行 D (mm)
        <input type="number" name="depth" value="400" min="100" max="3000" required />
      </label>
      <label>
        高さ H (mm)
        <input type="number" name="height" value="400" min="100" max="3000" required />
      </label>
      <label>
        板厚 (mm)
        <input type="number" name="thickness" value="18" min="6" max="40" />
      </label>
      <label>
        材質
        <select name="material">
          <option>パイン集成材</option>
          <option>シナベニヤ</option>
          <option>ラワン合板</option>
          <option>SPF材</option>
          <option>OSB合板</option>
        </select>
      </label>

      <div class="finish-group">
        <p class="finish-group-title">パーツごとの塗装（任意）</p>
        <label>
          天板
          <select name="finish-天板" class="finish-select">
            <option value="clear" selected>クリア塗装（材質の木目）</option>
            <option value="walnut">ウォルナット調</option>
            <option value="white">ホワイト</option>
            <option value="black">ブラック</option>
          </select>
        </label>
        <label>
          底板
          <select name="finish-底板" class="finish-select">
            <option value="clear" selected>クリア塗装（材質の木目）</option>
            <option value="walnut">ウォルナット調</option>
            <option value="white">ホワイト</option>
            <option value="black">ブラック</option>
          </select>
        </label>
        <label>
          側板
          <select name="finish-側板" class="finish-select">
            <option value="clear" selected>クリア塗装（材質の木目）</option>
            <option value="walnut">ウォルナット調</option>
            <option value="white">ホワイト</option>
            <option value="black">ブラック</option>
          </select>
        </label>
        <label>
          背板
          <select name="finish-背板" class="finish-select">
            <option value="clear" selected>クリア塗装（材質の木目）</option>
            <option value="walnut">ウォルナット調</option>
            <option value="white">ホワイト</option>
            <option value="black">ブラック</option>
          </select>
        </label>
      </div>

      <button type="submit" id="submit-btn">FreeCADでレンダリング</button>
      <div id="status" class="status"></div>
    </form>

    <div class="result">
      <div class="tabs" id="result-tabs" style="display: none;">
        <button type="button" class="tab-btn active" data-tab="image">完成イメージ</button>
        <button type="button" class="tab-btn" data-tab="viewer3d">3Dビューで動かす</button>
      </div>
      <div id="tab-image" class="tab-panel active">
        <div id="image-area"></div>
      </div>
      <div id="tab-viewer3d" class="tab-panel">
        <canvas id="viewer-3d-canvas"></canvas>
        <p class="viewer-hint">ドラッグで回転、スクロールでズーム、右ドラッグ（または2本指）で平行移動できます。</p>
      </div>
      <div id="cutlist-area"></div>
    </div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
// OrbitControls.jsは内部で `import ... from 'three'`（ベア指定子）しているため、
// 上記のimportmapで"three"の実URLを解決できるようにしないとブラウザがエラーになる
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const form = document.getElementById('render-form');
const submitBtn = document.getElementById('submit-btn');
const statusEl = document.getElementById('status');
const imageArea = document.getElementById('image-area');
const cutlistArea = document.getElementById('cutlist-area');
const resultTabs = document.getElementById('result-tabs');

// --- タブ切り替え ---
document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    if (btn.dataset.tab === 'viewer3d') resizeRenderer();
  });
});

// --- Three.js インタラクティブ3Dビューア ---
// パネルのジオメトリ（位置・サイズ）はAPIレスポンスの`panels`から取得し、
// 直方体（BoxGeometry）として組み立てる。FreeCAD/POV-Rayの完成イメージとは別に、
// ブラウザ内で自由に回転・ズームして確認できるようにするためのもの。
const canvas = document.getElementById('viewer-3d-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f1ec);

const camera = new THREE.PerspectiveCamera(45, 4 / 3, 1, 100000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

let panelGroup = new THREE.Group();
scene.add(panelGroup);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, -1, 2);
scene.add(dirLight);

function resizeRenderer() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', resizeRenderer);

function buildViewerFromPanels(panels) {
  scene.remove(panelGroup);
  panelGroup = new THREE.Group();

  // FreeCAD/POV-Ray側はZ軸を高さ方向として扱っているため、Three.js（Y軸が上）に
  // 合わせて y と z を入れ替える
  panels.forEach((p) => {
    const geometry = new THREE.BoxGeometry(p.dx, p.dz, p.dy);
    const material = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.8 });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(p.x + p.dx / 2, p.z + p.dz / 2, p.y + p.dy / 2);

    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x3a2f27 }));
    mesh.add(line);

    panelGroup.add(mesh);
  });

  scene.add(panelGroup);

  // 全体が収まるようにカメラを配置し直す
  const box = new THREE.Box3().setFromObject(panelGroup);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);

  camera.position.set(center.x + maxDim * 1.3, center.y + maxDim * 0.9, center.z + maxDim * 1.6);
  controls.target.copy(center);
  controls.update();

  resizeRenderer();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(form);
  const payload = {
    item: formData.get('item'),
    width: Number(formData.get('width')),
    depth: Number(formData.get('depth')),
    height: Number(formData.get('height')),
    thickness: Number(formData.get('thickness')),
    material: formData.get('material'),
    panelFinishes: {
      '天板': formData.get('finish-天板'),
      '底板': formData.get('finish-底板'),
      '側板': formData.get('finish-側板'),
      '背板': formData.get('finish-背板'),
    },
  };

  submitBtn.disabled = true;
  statusEl.className = 'status';
  statusEl.textContent = 'FreeCADでモデルを生成し、POV-Rayでレンダリング中です…（数十秒〜数分かかることがあります）';
  imageArea.innerHTML = '';
  cutlistArea.innerHTML = '';

  try {
    const res = await fetch('/api/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (!res.ok) {
      statusEl.className = 'status error';
      statusEl.textContent = (data.error || '不明なエラーが発生しました。') + (data.details ? '\n\n' + data.details : '');
      return;
    }

    statusEl.textContent = '完了しました。';
    resultTabs.style.display = 'flex';
    const mockBadge = data.mockMode
      ? '<div class="mock-badge">⚠ 簡易プレビュー表示中：FreeCAD/POV-Rayが見つからないため、実寸から計算した等角図で代用しています（本番のレンダリングではありません）</div>'
      : '';
    imageArea.innerHTML = `${mockBadge}<img src="${data.imageUrl}?t=${Date.now()}" alt="${data.item}の完成イメージ" />`;

    if (data.panels && data.panels.length > 0) {
      buildViewerFromPanels(data.panels);
    }

    if (data.cutlist && data.cutlist.length > 0) {
      const headers = Object.keys(data.cutlist[0]);
      const rows = data.cutlist.map(row => `<tr>${headers.map(h => `<td>${row[h]}</td>`).join('')}</tr>`).join('');
      cutlistArea.innerHTML = `
        <table>
          <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = '通信エラーが発生しました: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
