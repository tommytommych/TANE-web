# RenderのBlueprint定義（Infrastructure as Code）。
#
# 【背景】手動でWeb Serviceを作成した際、Root Directory/RuntimeがDockerfileを指さない
# 状態（リポジトリルートのNext.jsアプリの方をNode.jsとして誤検出）でデプロイされてしまい、
# https://tane-i-1.onrender.com が設計スタジオ（FreeCAD+POV-Ray）ではなくTANE:iチャットの
# 画面を返すという不具合が起きた。この設定ミスをダッシュボードの手入力に頼らず確実に
# 再現できるよう、YAMLとして明示的に定義しておく。
#
# 【使い方】Renderダッシュボード → New + → Blueprint → このリポジトリを接続 →
# Blueprint Pathに `tanei-studio/render.yaml` を指定する。
# 既存の誤設定サービス（tane-i-1）を削除してからこのBlueprintで作り直せば、
# サービス名が同じ（tane-i-1）なのでURL（https://tane-i-1.onrender.com）も変わらず、
# Vercel側のNEXT_PUBLIC_STUDIO_BASE_URLを変更・再デプロイする必要はない。
#
# 詳細はDEPLOY.md参照。

services:
  - name: tane-i-1
    type: web
    runtime: docker
    plan: starter
    region: singapore
    rootDir: tanei-studio
    dockerfilePath: tanei-studio/Dockerfile
    dockerContext: tanei-studio
    healthCheckPath: /
